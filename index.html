<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeLink - Homelab Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style>
    :root {
      --bg-color: #0b0f17;
      --text-color: #f1f5f9;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --card-bg: rgba(30, 41, 59, 0.65);
      --border-color: rgba(255, 255, 255, 0.08);
    }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
    .glass-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); transition: all 0.25s ease; }
    .glass-card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-3px); box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5); }
  </style>
</head>
<body class="relative selection:bg-orange-500 selection:text-white pb-12">

  <div id="custom-bg-overlay" class="fixed inset-0 pointer-events-none z-0" style="display: none;"></div>

  <header class="sticky top-0 z-30 glass-panel border-b border-white/10 px-4 lg:px-8 py-3 mb-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-500/30">
          <i class="fa-solid text-white text-xl fa-house-signal"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight flex items-center gap-2">
            HomeLink <span class="text-xs px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-400 font-semibold border border-orange-500/30">v2.6</span>
          </h1>
          <p id="live-date" class="text-xs opacity-70 font-medium">Loading date...</p>
        </div>
      </div>

      <div class="w-full md:max-w-xl">
        <form onsubmit="event.preventDefault();" class="relative flex items-center">
          <input type="text" id="search-input" placeholder="Filter homelab tiles..." class="w-full h-10 bg-slate-900/60 text-sm text-slate-100 placeholder-slate-400 px-4 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/50" oninput="onSearchInput(this.value)" />
        </form>
      </div>

      <div class="flex items-center gap-2.5">
        <button onclick="toggleEditMode()" id="btn-edit-mode" class="h-10 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10 text-sm font-semibold flex items-center gap-2">
          <i id="edit-mode-icon" class="fa-solid fa-lock text-amber-400"></i>
          <span id="edit-mode-label">Locked</span>
        </button>
        <button onclick="openAppModal()" id="btn-add-link-header" class="hidden h-10 px-3 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white text-sm font-semibold items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Link
        </button>
        <button onclick="openSettingsModal()" class="h-10 w-10 flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 lg:px-8 z-10 relative">
    <div class="flex items-center justify-between gap-4 mb-6">
      <div id="category-tabs" class="flex items-center gap-1.5 overflow-x-auto w-full pb-2"></div>
    </div>
    <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
  </main>

  <!-- Add App Modal -->
  <div id="app-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <div class="glass-panel w-full max-w-lg rounded-2xl border border-white/10 p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/10">
        <h3 class="text-lg font-bold">Add New Tile</h3>
        <button onclick="closeAppModal()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="saveApp(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Service Name *</label>
          <input type="text" id="app-name" required placeholder="e.g. Plex" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Category *</label>
          <select id="app-category" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">URL *</label>
          <input type="url" id="app-url" required placeholder="http://192.168.1.100:32400" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Icon (FontAwesome class or URL)</label>
          <div class="flex gap-2">
            <input type="text" id="app-icon" placeholder="fa-solid fa-server" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white">
            <button type="button" onclick="openIconPickerModal()" class="px-3 py-2 bg-orange-600 text-white rounded-xl text-xs font-semibold whitespace-nowrap">Browse</button>
          </div>
        </div>
        <div class="pt-4 border-t border-white/10 flex justify-end gap-3">
          <button type="button" onclick="closeAppModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-orange-600 text-white rounded-xl text-xs font-semibold">Save Tile</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Icon Picker Modal -->
  <div id="icon-picker-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-2xl rounded-2xl border border-white/10 p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
        <h3 class="text-base font-bold">Select Icon</h3>
        <button onclick="closeIconPickerModal()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="text" id="icon-search-input" placeholder="Search icons..." class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mb-4" oninput="filterIconGrid(this.value)">
      <div id="icon-grid-container" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2.5 overflow-y-auto max-h-[50vh] p-1"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <div class="glass-panel w-full max-w-xl rounded-2xl border border-white/10 p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/10">
        <h3 class="text-lg font-bold">Settings & Local Assets</h3>
        <button onclick="closeSettingsModal()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-semibold">Local Scoped Assets Manager</label>
            <button onclick="loadLocalAssetsManager()" class="text-xs text-orange-400 font-semibold">Refresh</button>
          </div>
          <div id="local-icons-manager-list" class="space-y-1.5 max-h-44 overflow-y-auto p-2 bg-slate-900/50 rounded-xl border border-white/5"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let profiles = [{
      id: 'admin',
      name: 'Admin',
      isMain: true,
      apps: [
        { id: '1', name: 'TrueNAS CORE', category: 'Storage & NAS', url: 'https://truenas.local', icon: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/truenas.png', color: 'orange' },
        { id: '2', name: 'Home Assistant', category: 'Smart Home', url: 'http://192.168.1.234:8123', icon: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/home-assistant.png', color: 'blue' }
      ],
      categories: ['Media', 'Storage & NAS', 'Smart Home', 'Networking', 'Web']
    }];
    let currentProfileId = 'admin', activeCategory = 'All', searchQuery = '', isEditMode = false;

    const unifiedIconLibrary = [
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/plex.png', name: 'plex' },
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/sonarr.png', name: 'sonarr' },
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/radarr.png', name: 'radarr' },
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyfin.png', name: 'jellyfin' },
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/immich.png', name: 'immich' },
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/truenas.png', name: 'truenas' },
      { type: 'url', value: 'https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/home-assistant.png', name: 'home assistant' },
      { type: 'fa', value: 'fa-solid fa-server', name: 'server' },
      { type: 'fa', value: 'fa-solid fa-database', name: 'database' },
      { type: 'fa', value: 'fa-solid fa-network-wired', name: 'network' }
    ];

    window.addEventListener('DOMContentLoaded', async () => {
      await loadState();
      renderCategories();
      renderApps();
      document.getElementById('live-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    });

    async function loadState() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (data && Array.isArray(data.profiles) && data.profiles.length > 0) {
          profiles = data.profiles;
        }
      } catch (e) {}
    }

    async function saveState() {
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profiles, currentProfileId })
      });
    }

    function getCurrentProfile() {
      return profiles.find(p => p.id === currentProfileId) || profiles[0];
    }

    function renderCategories() {
      const p = getCurrentProfile();
      const cats = ['All', ...(p.categories || [])];
      document.getElementById('category-tabs').innerHTML = cats.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${activeCategory === cat ? 'bg-orange-600 text-white' : 'bg-slate-900/50 text-slate-300'}">${cat}</button>
      `).join('');
      document.getElementById('app-category').innerHTML = (p.categories || []).map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function setCategory(cat) { activeCategory = cat; renderCategories(); renderApps(); }

    function renderApps() {
      const p = getCurrentProfile();
      const grid = document.getElementById('apps-grid');
      const apps = p.apps || [];
      const filtered = apps.filter(a => {
        const matchesCat = activeCategory === 'All' || a.category === activeCategory;
        const matchesSearch = !searchQuery || a.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      grid.innerHTML = filtered.map(app => `
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between relative group">
          ${isEditMode ? `
            <div class="absolute top-2 right-2 z-20">
              <button onclick="deleteApp('${app.id}')" class="w-6 h-6 rounded-lg bg-rose-500/20 text-rose-400 text-xs flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>
            </div>
          ` : ''}
          <a href="${app.url}" target="_blank" class="block">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-10 h-10 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-xl text-orange-400 overflow-hidden">
                ${app.icon && (app.icon.startsWith('http') || app.icon.startsWith('/data/')) ? `<img src="${app.icon}" class="w-full h-full object-contain p-1" />` : `<i class="${app.icon || 'fa-solid fa-globe'}"></i>`}
              </div>
              <h4 class="font-bold text-sm text-white truncate">${app.name}</h4>
            </div>
            <p class="text-[11px] opacity-60 truncate">${app.url}</p>
          </a>
        </div>
      `).join('');
    }

    function onSearchInput(val) { searchQuery = val; renderApps(); }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('edit-mode-label').innerText = isEditMode ? 'Unlocked' : 'Locked';
      document.getElementById('edit-mode-icon').className = isEditMode ? 'fa-solid fa-lock-open text-emerald-400' : 'fa-solid fa-lock text-amber-400';
      document.getElementById('btn-add-link-header').classList.toggle('hidden', !isEditMode);
      renderApps();
    }

    function openAppModal() { document.getElementById('app-modal').classList.remove('hidden'); }
    function closeAppModal() { document.getElementById('app-modal').classList.add('hidden'); }

    async function saveApp(e) {
      e.preventDefault();
      const p = getCurrentProfile();
      if (!p.apps) p.apps = [];
      p.apps.unshift({
        id: Date.now().toString(),
        name: document.getElementById('app-name').value,
        category: document.getElementById('app-category').value,
        url: document.getElementById('app-url').value,
        icon: document.getElementById('app-icon').value || 'fa-solid fa-globe',
        color: 'orange'
      });
      await saveState();
      renderApps();
      closeAppModal();
    }

    async function deleteApp(id) {
      const p = getCurrentProfile();
      p.apps = p.apps.filter(a => a.id !== id);
      await saveState();
      renderApps();
    }

    function openIconPickerModal() { renderIconGrid(''); document.getElementById('icon-picker-modal').classList.remove('hidden'); }
    function closeIconPickerModal() { document.getElementById('icon-picker-modal').classList.add('hidden'); }
    function renderIconGrid(q) {
      document.getElementById('icon-grid-container').innerHTML = unifiedIconLibrary.filter(i => i.name.includes(q)).map(i => `
        <button type="button" onclick="selectIcon('${i.value}')" class="p-2 bg-slate-900 border border-white/10 rounded-xl flex flex-col items-center justify-center">
          ${i.type === 'url' ? `<img src="${i.value}" class="w-6 h-6 object-contain" />` : `<i class="${i.value} text-base text-white"></i>`}
        </button>
      `).join('');
    }
    function filterIconGrid(val) { renderIconGrid(val.toLowerCase()); }
    function selectIcon(val) { document.getElementById('app-icon').value = val; closeIconPickerModal(); }

    async function loadLocalAssetsManager() {
      const listEl = document.getElementById('local-icons-manager-list');
      try {
        const res = await fetch('/api/assets');
        const assets = await res.json();
        listEl.innerHTML = assets.map(a => `
          <div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl text-xs">
            <div class="flex items-center gap-2 truncate">
              <img src="${a.url}" class="w-8 h-8 object-cover rounded bg-slate-800" />
              <span class="text-white truncate">${a.filename}</span>
            </div>
            <button onclick="deleteAsset('${a.type}', '${a.filename}')" class="text-rose-400 px-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = `<div class="text-xs text-rose-400">Failed to load assets.</div>`;
      }
    }

    async function deleteAsset(type, filename) {
      await fetch(`/api/assets/${type}/${filename}`, { method: 'DELETE' });
      loadLocalAssetsManager();
    }

    function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); loadLocalAssetsManager(); }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
  </script>
</body>
</html>
