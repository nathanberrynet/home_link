services:
  homelink:
    image: node:20-alpine
    container_name: homelink-dashboard
    restart: unless-stopped
    ports:
      - 8580:8580
    working_dir: /app
    command: >
      sh -c "
      if [ -d '.git' ]; then
        git pull;
      else
        git clone https://github.com/nathanberrynet/home_link.git .;
      fi &&
      npm install &&
      node server.js
      "
    volumes:
      - ./data:/app/data
